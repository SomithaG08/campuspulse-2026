<!DOCTYPE html>
<!--
  CampusPulse 2026 - sign-in page.

  After signing in, administrators go to admin.html and students to
  student.html (professor's review, October 2026: one page per role).

  No framework, no build step, no dependencies. The pages hold no data of
  their own: everything arrives from the API, which refuses to answer without
  a valid Cognito token - see docs/security/01-threat-model.md, T5.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CampusPulse 2026 · Sign in</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="dot" aria-hidden="true"></span>
    <h1>CampusPulse <span class="year">2026</span></h1>
    <span class="campus">NorthBridge University</span>
  </div>
</header>

<main class="login-view">
  <form id="login-form" class="card login-card" autocomplete="on">
    <h2>Sign in</h2>
    <p class="muted">Administrators see the operations dashboard. Students see free rooms and their service requests.</p>

    <label for="username">Email</label>
    <input id="username" name="username" type="email" required
           autocomplete="username" placeholder="you@northbridge.edu">

    <label for="password">Password</label>
    <input id="password" name="password" type="password" required
           autocomplete="current-password">

    <button id="login-btn" class="btn" type="submit">Sign in</button>
    <p id="login-error" class="error" role="alert" hidden></p>
  </form>
</main>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
